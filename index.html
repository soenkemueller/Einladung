<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Unsere Einladung</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: flex-start;

            background: #f5f3ef;
        }

        .container {
            width: 100%;
            max-width: 900px;
            text-align: center;
        }

        .card {
            display: inline-block;
            max-width: 100%;
            background: white;
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .card img {
            display: block;
            max-width: 100%;
            height: auto;
            border-radius: 6px;
        }

        .hint {
            margin-top: 15px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            color: #777;
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="card">
            <img
                src="einladung.png"
                alt="Einladung"
            >
        </div>

        <div class="hint">
            Wir freuen uns auf dich!
        </div>

    </main>

</body>
</html>
