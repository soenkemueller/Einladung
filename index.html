<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <!-- Optimiert für Smartphones -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday</title>
    <style>
        * {
            box-sizing: border-box;
        }
        html {
            background: #f4f1ec;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 16px;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;
            background:
                linear-gradient(
                    135deg,
                    #f7f4ef 0%,
                    #eee9e1 100%
                );
            color: #333;
        }
        .page {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        /* Karte */
        .invitation {
            width: 100%;
            background: #ffffff;
            padding: 8px;
            border-radius: 14px;
            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.10);
            overflow: hidden;
        }
        .invitation img {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 8px;
        }
        /* Kleiner Text unter der Karte */
        .footer {
            padding: 18px 10px 8px;
            text-align: center;
            font-size: 14px;
            line-height: 1.5;
            color: #777;
        }
        /* Smartphones */
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }
            .invitation {
                padding: 5px;
                border-radius: 10px;
                box-shadow:
                    0 5px 20px rgba(0, 0, 0, 0.08);
            }
            .invitation img {
                border-radius: 6px;
            }
            .footer {
                padding-top: 14px;
                font-size: 13px;
            }
        }
        /* Sehr kleine Smartphones */
        @media (max-width: 380px) {
            body {
                padding: 6px;
            }
            .invitation {
                padding: 3px;
                border-radius: 8px;
            }
            .footer {
                display: none;
            }
        }
    </style>
</head>
<body>
    <main class="page">
        <div class="invitation">
            <img
                src="Einladung.png"
                alt="Einladung"
            >
        </div>
        <div class="footer">
            Wir freuen uns auf dich!
        </div>
    </main>
</body>
</html>
